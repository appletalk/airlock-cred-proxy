# airlock-cred-proxy example: a GitHub App identity for an agent that works on two repos.

[server]
socket = "/run/airlock-cred-proxy/app.sock"      # 107-byte limit on Unix socket paths
socket_mode = "0660"
socket_group = "airlock-cred-proxy-clients"       # only when not socket-activated (contrib/ units set it there)
audit_log = "/var/log/airlock-cred-proxy/app.jsonl"   # "-" for stderr (journald)
# api_url = "https://api.github.com"
# git_url = "https://github.com"

[identity]
kind = "github-app"
app_id = 123456
owner = "example-org"                        # the installation's account
# installation_id = 0                        # optional; found from owner when unset
key = { systemd_credential = "app-key" }     # or { file = "/path/key.pem" } or { command = ["pass", "show", "x"] }
                                             # or { pass = "github/app.pem" }: delivered by `unlock`, see [unlock]

[policy]
repos = ["example-org/service-a", "example-org/service-b"]
permissions = { contents = "write", pull_requests = "write", issues = "write" }
push_branches = ["agent/*"]
push_tags = false
deny_approvals = true
merge_denied_bases = ["main"]                # merges into these are always refused

[policy.repo."example-org/service-b"]
merge_denied_bases = ["release/*"]           # added to the global list for this repo
# permissions = { issues = "write", contents = "read", pull_requests = "read" }
#                                            # replaces the global set for this repo; see docs/repo-permissions.md

# Optional:
# graphql_mutations = ["createPullRequest", "addComment"]     # replaces the default allowlist
# rest_allow = [["POST", "/repos/{owner}/{repo}/check-runs"]] # extra REST writes
# read_paths = ["/rate_limit", "/meta", "/zen", "/users/*"]   # non-repo GETs
# projects = ["PVT_kwDO..."]      # pin project (v2) mutations to these boards
# rest_writes = false             # refuse every REST write (git pushes follow push_branches)

# With a pass source (docs/unlock.md):
# [unlock]
# max_lifetime = "10h"          # required, at most 24h
# expire_at = "18:00"           # optional, local time
# idle = "2h"                   # optional
